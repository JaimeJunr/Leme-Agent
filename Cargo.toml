[package]
name = "harness"
version = "0.1.0"
edition = "2024"
description = "A fast, native coding agent for your terminal — any model on OpenRouter."
repository = "https://github.com/jaimejunr/harness"
readme = "README.md"
keywords = ["ai", "agent", "cli", "openrouter", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hex = "0.4.3"
htmd = "0.5.5"
ignore = "0.4.33"
libc = "0.2.189"
parking_lot = "0.12.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
